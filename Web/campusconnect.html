<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusConnect VIT Pune</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','Roboto','system-ui','sans-serif']}}}}</script>
<style>
  body{background:#F8F9FA;font-family:'Inter',Roboto,system-ui,sans-serif}
  .dark body{background:#121212}
  .card{border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.05);transition:transform .2s ease,box-shadow .2s ease;animation:fade .35s ease both}
  .card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 12px 32px rgba(26,115,232,.16)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .pills{scrollbar-width:none;scroll-behavior:smooth}.pills::-webkit-scrollbar{display:none}
  dialog{border:0;padding:0;background:transparent;max-width:100vw}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog[open]{animation:pop .22s ease}
  @keyframes pop{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .star{transition:transform .2s}.star:active{transform:scale(1.4) rotate(15deg)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="text-slate-800 dark:text-slate-100 text-sm">

<header class="bg-white/90 dark:bg-[#1e1e1e]/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-2 font-bold text-lg">
      <span class="flex gap-0.5"><i class="w-2 h-2 rounded-full bg-[#1A73E8]"></i><i class="w-2 h-2 rounded-full bg-[#EA4335]"></i><i class="w-2 h-2 rounded-full bg-[#FBBC04]"></i><i class="w-2 h-2 rounded-full bg-[#34A853]"></i></span>
      CampusConnect
    </div>
    <div class="flex items-center gap-2">
      <button id="savedToggle" aria-pressed="false" class="px-3 py-1.5 rounded-full border border-slate-300 dark:border-slate-700 font-medium hover:bg-slate-100 dark:hover:bg-slate-800">★ Saved <span id="savedCount">0</span></button>
      <button id="themeToggle" aria-label="Toggle dark mode" class="w-9 h-9 rounded-full border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">🌓</button>
    </div>
  </div>
</header>

<main>
  <section class="max-w-3xl mx-auto px-4 pt-12 pb-8 text-center">
    <h1 class="text-4xl font-bold tracking-tight">Navigate VIT Pune Like a Pro.</h1>
    <p class="mt-3 text-slate-600 dark:text-slate-400 text-base">Clubs, events and study resources, all in one place.</p>
    <div class="mt-5 flex justify-center gap-8">
      <div><div class="text-2xl font-bold text-[#1A73E8]">30+</div><div class="text-slate-500">Active clubs</div></div>
      <div><div class="text-2xl font-bold text-[#34A853]">50+</div><div class="text-slate-500">Annual events</div></div>
    </div>
    <div class="mt-7 relative">
      <label for="search" class="sr-only">Search clubs, events and resources</label>
      <input id="search" type="search" autocomplete="off" placeholder="Search clubs, events, tags, venues…"
        class="w-full h-14 rounded-full pl-6 pr-6 bg-white dark:bg-[#1e1e1e] border border-slate-200 dark:border-slate-700 shadow-[0_4px_20px_rgba(0,0,0,.06)] text-base focus:outline-none focus:ring-2 focus:ring-[#1A73E8]">
    </div>
  </section>

  <nav aria-label="Categories" class="sticky top-0 z-20 bg-[#F8F9FA]/95 dark:bg-[#121212]/95 backdrop-blur py-3 border-b border-slate-200 dark:border-slate-800">
    <div id="pills" class="pills max-w-6xl mx-auto px-4 flex gap-2 overflow-x-auto"></div>
  </nav>

  <section class="max-w-6xl mx-auto px-4 py-8">
    <p id="resultCount" class="mb-4 text-slate-500" aria-live="polite"></p>
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    <div id="empty" class="hidden text-center py-16">
      <p class="text-lg font-semibold">Nothing matches that search</p>
      <p class="text-slate-500 mt-1">Try a different keyword or switch to All.</p>
      <button id="reset" class="mt-4 px-5 py-2 rounded-full bg-[#1A73E8] text-white font-medium">Clear filters</button>
    </div>
  </section>
</main>

<footer class="text-center text-slate-500 py-8">CampusConnect · Built for VIT Pune freshers</footer>

<dialog id="modal" aria-labelledby="mTitle" class="w-full sm:max-w-lg m-auto">
  <div class="bg-white dark:bg-[#1e1e1e] rounded-t-3xl sm:rounded-3xl max-h-[92vh] overflow-y-auto p-6 shadow-2xl">
    <div class="flex justify-between items-start gap-3">
      <div><span id="mBadge"></span><h2 id="mTitle" class="mt-2 text-xl font-semibold"></h2></div>
      <button id="mClose" aria-label="Close" class="w-9 h-9 shrink-0 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-lg">✕</button>
    </div>
    <p id="mDesc" class="mt-3 text-slate-600 dark:text-slate-300"></p>
    <dl class="mt-4 grid grid-cols-[auto,1fr] gap-x-4 gap-y-2">
      <dt class="font-medium text-slate-500">Venue</dt><dd id="mVenue"></dd>
      <dt class="font-medium text-slate-500">When</dt><dd id="mTime"></dd>
      <dt class="font-medium text-slate-500">Tags</dt><dd id="mTags" class="flex flex-wrap gap-1"></dd>
    </dl>
    <form id="rsvp" novalidate class="mt-6 pt-5 border-t border-slate-200 dark:border-slate-700 space-y-4">
      <h3 id="fTitle" class="font-semibold text-base"></h3>
      <div>
        <label for="fName" class="font-medium">Full name</label>
        <input id="fName" type="text" autocomplete="name" class="field">
        <p class="err" data-for="fName"></p>
      </div>
      <div>
        <label for="fPrn" class="font-medium">PRN (8 or 9 characters)</label>
        <input id="fPrn" type="text" inputmode="text" maxlength="9" class="field">
        <p class="err" data-for="fPrn"></p>
      </div>
      <div>
        <label for="fEmail" class="font-medium">College email</label>
        <input id="fEmail" type="email" autocomplete="email" placeholder="name@vit.edu" class="field">
        <p class="err" data-for="fEmail"></p>
      </div>
      <button type="submit" id="fSubmit" class="w-full h-11 rounded-full bg-[#1A73E8] hover:bg-[#1557b0] text-white font-semibold"></button>
    </form>
    <div id="success" class="hidden mt-6 p-4 rounded-2xl bg-[#34A853]/10 text-[#188038] dark:text-[#81c995] font-medium" role="status"></div>
  </div>
</dialog>

<style>
  .field{width:100%;margin-top:4px;height:44px;padding:0 14px;border-radius:12px;border:1.5px solid #cbd5e1;background:transparent;outline:none}
  .field:focus{border-color:#1A73E8;box-shadow:0 0 0 3px rgba(26,115,232,.2)}
  .field.bad{border-color:#EA4335}.field.good{border-color:#34A853}
  .err{color:#EA4335;font-size:12px;margin-top:4px;min-height:0}
  .dark .field{border-color:#475569}
  button:focus-visible,.card:focus-visible{outline:2px solid #1A73E8;outline-offset:2px}
</style>

<script>
const campusData = [
  {id:1,title:"Google Developer Groups (GDG VIT Pune)",category:"tech",type:"club",description:"Build web, mobile and cloud solutions while learning from peers.",venue:"AB-3 Lab 4",time:"Every Thursday, 5 PM",tags:["Web","Flutter","AI/ML"]},
  {id:2,title:"ACM Student Chapter",category:"tech",type:"club",description:"Competitive programming, research talks and DSA bootcamps.",venue:"AB-2 Seminar Hall",time:"Every Tuesday, 4:30 PM",tags:["DSA","Research","CP"]},
  {id:3,title:"CSI VIT Pune",category:"tech",type:"club",description:"Workshops on cybersecurity, cloud and open source contributions.",venue:"AB-4 Lab 2",time:"Every Wednesday, 5 PM",tags:["Security","Cloud","Open Source"]},
  {id:4,title:"E-Cell",category:"tech",type:"club",description:"Pitch ideas, meet founders and run your own startup sprint.",venue:"Innovation Centre",time:"Every Friday, 4 PM",tags:["Startups","Pitching","Networking"]},
  {id:5,title:"Rhythm: Music & Dance Society",category:"cultural",type:"club",description:"Jam sessions, choreography practice and performances for fest season.",venue:"Open Air Theatre",time:"Mon & Thu, 6 PM",tags:["Music","Dance","Fest"]},
  {id:6,title:"Dramatics Club: Rangmanch",category:"cultural",type:"club",description:"Street plays, theatre workshops and annual stage productions.",venue:"Main Auditorium",time:"Every Saturday, 3 PM",tags:["Theatre","Acting","Writing"]},
  {id:7,title:"Photography Club: Aperture",category:"cultural",type:"club",description:"Photo walks, editing sessions and event coverage opportunities.",venue:"Campus Quad",time:"Every Sunday, 8 AM",tags:["Photo","Editing","Walks"]},
  {id:8,title:"Hack-a-Thon 24 Hour Sprint",category:"event",type:"event",description:"Team up, build a working prototype overnight and demo to judges.",venue:"Main Auditorium",time:"15 Nov 2026, 9 AM",tags:["Hackathon","Teams","Prizes"]},
  {id:9,title:"Android Study Jam",category:"event",type:"event",description:"Hands-on beginner session to build your first Kotlin app.",venue:"AB-3 Lab 4",time:"7 Nov 2026, 2 PM",tags:["Android","Kotlin","Beginner"]},
  {id:10,title:"Robotics Showcase",category:"event",type:"event",description:"Live demos of line followers, drones and robotic arms by senior teams.",venue:"Mechanical Quad",time:"21 Nov 2026, 11 AM",tags:["Robotics","Demo","Mechanical"]},
  {id:11,title:"Placement Prep Talk: Seniors Speak",category:"event",type:"event",description:"Seniors share internship stories, resume tips and interview mistakes.",venue:"AB-1 Room 101",time:"4 Nov 2026, 5 PM",tags:["Careers","Internships","Talk"]},
  {id:12,title:"Engineering Maths: PYQ Vault",category:"academic",type:"resource",description:"Previous year question papers with worked solutions for first-year maths.",venue:"Library, Digital Section",time:"Available 24/7",tags:["Maths","PYQ","Notes"]},
  {id:13,title:"Programming in C: Lab Manual",category:"academic",type:"resource",description:"Lab experiments, sample programs and viva questions in one place.",venue:"AB-2 Lab 1",time:"Available 24/7",tags:["C","Lab","Viva"]},
  {id:14,title:"Peer Tutoring Circle",category:"academic",type:"resource",description:"Free weekly doubt-clearing sessions run by top-scoring seniors.",venue:"Library, Discussion Room 3",time:"Every Monday, 6 PM",tags:["Tutoring","Doubts","Physics"]}
];

const cats = [
  {key:"all",label:"All"},{key:"tech",label:"Tech Clubs"},{key:"cultural",label:"Cultural"},
  {key:"event",label:"Upcoming Events"},{key:"academic",label:"Academic Resources"}
];
const badge = {
  tech:["Tech","bg-blue-100 text-[#1557b0] dark:bg-blue-900/40 dark:text-blue-200"],
  cultural:["Cultural","bg-red-100 text-[#c5221f] dark:bg-red-900/40 dark:text-red-200"],
  event:["Event","bg-yellow-100 text-[#8a5a00] dark:bg-yellow-900/40 dark:text-yellow-200"],
  academic:["Academic","bg-green-100 text-[#188038] dark:bg-green-900/40 dark:text-green-200"]
};
const $ = s => document.querySelector(s);
const grid=$('#grid'), modal=$('#modal'), form=$('#rsvp');
let state={cat:"all",q:"",savedOnly:false,current:null};
let bookmarks=[];
try{bookmarks=JSON.parse(localStorage.getItem('vit_bookmarks'))||[]}catch(e){}
const saveBookmarks=()=>{try{localStorage.setItem('vit_bookmarks',JSON.stringify(bookmarks))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tagHtml=t=>`<span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-xs">${esc(t)}</span>`;
const badgeHtml=c=>`<span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${badge[c][1]}">${badge[c][0]}</span>`;
const verb=i=>i.type==="event"?"Register":"Explore";

function renderPills(){
  $('#pills').innerHTML=cats.map(c=>{
    const on=state.cat===c.key;
    return `<button data-cat="${c.key}" aria-pressed="${on}" class="whitespace-nowrap px-4 py-2 rounded-full font-medium border transition-colors ${on?'bg-[#1A73E8] border-[#1A73E8] text-white':'bg-white dark:bg-[#1e1e1e] border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800'}">${c.label}</button>`;
  }).join('');
}

function render(){
  const q=state.q.trim().toLowerCase();
  const list=campusData
    .filter(i=>state.cat==="all"||i.category===state.cat)
    .filter(i=>!state.savedOnly||bookmarks.includes(i.id))
    .filter(i=>!q||[i.title,i.description,i.venue,i.time,i.category,...i.tags].join(' ').toLowerCase().includes(q));
  grid.innerHTML=list.map(i=>`
    <article class="card bg-white dark:bg-[#1e1e1e] p-5 flex flex-col cursor-pointer" tabindex="0" data-id="${i.id}" aria-label="${esc(i.title)}">
      <div class="flex justify-between items-start">
        ${badgeHtml(i.category)}
        <button class="star w-9 h-9 -mt-1 -mr-2 rounded-full text-xl hover:bg-slate-100 dark:hover:bg-slate-800 ${bookmarks.includes(i.id)?'text-[#FBBC04]':'text-slate-400'}" data-star="${i.id}" aria-pressed="${bookmarks.includes(i.id)}" aria-label="Bookmark ${esc(i.title)}">${bookmarks.includes(i.id)?'★':'☆'}</button>
      </div>
      <h3 class="mt-3 text-lg font-semibold leading-snug">${esc(i.title)}</h3>
      <p class="mt-1.5 text-slate-600 dark:text-slate-400 flex-1">${esc(i.description)}</p>
      <p class="mt-3 text-slate-500 text-xs">📍 ${esc(i.venue)} &nbsp; 🕒 ${esc(i.time)}</p>
      <div class="mt-3 flex flex-wrap gap-1">${i.tags.map(tagHtml).join('')}</div>
      <button class="mt-4 h-10 rounded-full bg-[#1A73E8] hover:bg-[#1557b0] text-white font-medium" data-open="${i.id}">${verb(i)}</button>
    </article>`).join('');
  $('#empty').classList.toggle('hidden',list.length>0);
  $('#resultCount').textContent=`${list.length} ${list.length===1?'result':'results'}`;
  $('#savedCount').textContent=bookmarks.length;
  const st=$('#savedToggle');
  st.setAttribute('aria-pressed',state.savedOnly);
  st.classList.toggle('bg-yellow-100',state.savedOnly);st.classList.toggle('dark:bg-yellow-900/40',state.savedOnly);
}

function toggleBookmark(id){
  bookmarks=bookmarks.includes(id)?bookmarks.filter(b=>b!==id):[...bookmarks,id];
  saveBookmarks();render();
}

/* Search (debounced) */
let timer;
$('#search').addEventListener('input',e=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{state.q=e.target.value;render()},150);
});
$('#pills').addEventListener('click',e=>{
  const b=e.target.closest('[data-cat]');if(!b)return;
  state.cat=b.dataset.cat;renderPills();render();
});
$('#savedToggle').addEventListener('click',()=>{state.savedOnly=!state.savedOnly;render()});
$('#reset').addEventListener('click',()=>{state={...state,cat:"all",q:"",savedOnly:false};$('#search').value="";renderPills();render()});

grid.addEventListener('click',e=>{
  const star=e.target.closest('[data-star]');
  if(star){e.stopPropagation();toggleBookmark(+star.dataset.star);return}
  const card=e.target.closest('[data-id]');
  if(card)openModal(+card.dataset.id);
});
grid.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('article')){openModal(+e.target.dataset.id)}
});

/* Modal */
function openModal(id){
  const i=campusData.find(x=>x.id===id);if(!i)return;
  state.current=i;
  $('#mBadge').innerHTML=badgeHtml(i.category);
  $('#mTitle').textContent=i.title;
  $('#mDesc').textContent=i.description;
  $('#mVenue').textContent=i.venue;
  $('#mTime').textContent=i.time;
  $('#mTags').innerHTML=i.tags.map(tagHtml).join('');
  $('#fTitle').textContent=i.type==="event"?"Register for this event":"Join this "+(i.type==="club"?"club":"resource");
  $('#fSubmit').textContent=i.type==="event"?"Confirm registration":"Send request";
  form.reset();clearErrors();
  form.classList.remove('hidden');$('#success').classList.add('hidden');
  modal.showModal();
}
const closeModal=()=>modal.close();
$('#mClose').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

/* Validation */
const rules={
  fName:v=>/^[A-Za-z][A-Za-z .'-]{2,}$/.test(v.trim())?"":"Enter your full name (letters only, at least 3 characters).",
  fPrn:v=>/^[A-Za-z0-9]{8,9}$/.test(v.trim())?"":"PRN must be exactly 8 or 9 letters or digits.",
  fEmail:v=>/^[a-zA-Z0-9._%+-]+@vit\.edu$/.test(v.trim())?"":"Use your college email ending in @vit.edu."
};
function check(id,show=true){
  const el=document.getElementById(id),msg=rules[id](el.value);
  const err=document.querySelector(`[data-for="${id}"]`);
  if(show){
    err.textContent=msg;
    el.classList.toggle('bad',!!msg);el.classList.toggle('good',!msg&&el.value!=="");
    el.setAttribute('aria-invalid',!!msg);
  }
  return !msg;
}
function clearErrors(){
  Object.keys(rules).forEach(id=>{
    const el=document.getElementById(id);el.classList.remove('bad','good');el.removeAttribute('aria-invalid');
    document.querySelector(`[data-for="${id}"]`).textContent="";
  });
}
Object.keys(rules).forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>check(id));
  document.getElementById(id).addEventListener('blur',()=>check(id));
});
form.addEventListener('submit',e=>{
  e.preventDefault();
  const ok=Object.keys(rules).map(id=>check(id)).every(Boolean);
  if(!ok){form.querySelector('.bad')?.focus();return}
  const first=$('#fName').value.trim().split(' ')[0];
  form.classList.add('hidden');
  const s=$('#success');
  s.textContent=`You're in, ${first}! We've noted your ${state.current.type==="event"?"registration":"request"} for ${state.current.title}.`;
  s.classList.remove('hidden');
  setTimeout(()=>{if(modal.open)closeModal()},2600);
});

/* Theme */
const root=document.documentElement;
try{if(localStorage.getItem('vit_theme')==='dark')root.classList.add('dark')}catch(e){}
$('#themeToggle').addEventListener('click',()=>{
  root.classList.toggle('dark');
  try{localStorage.setItem('vit_theme',root.classList.contains('dark')?'dark':'light')}catch(e){}
});

renderPills();render();
</script>
</body>
</html>
